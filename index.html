        /* Core Layout Elements */
        body {
            background-color: #303132;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.5px;
        }

        /* Container Layout */
        .gateway-container {
            width: 100%;
            max-width: 1200px;
            padding: 20px 40px 40px 40px;
            text-align: center;
            box-sizing: border-box;
            margin: 0 auto;
        }

        .sx-sovereign {
            font-weight: 500;
        }

        .sx-bold {
            font-weight: 700;
        }

        /* Crown Branding Layer */
        .logo-container {
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
            position: relative;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Balanced Proportional Divider Line */
        .brand-divider {

        h1 {

            letter-spacing: 4px;
            display: block;
            width: 100%;
            max-width: 950px;
            
            /* Original 90-degree smooth silver horizontal glisten matrix */
            background: linear-gradient(90deg, #ffffff 0%, #ffffff 35%, #9da1aa 48%, #ffffff 55%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            animation: textReflectionWash 6s infinite linear;
        }

        .bold-gateway {
            font-weight: 700;
            letter-spacing: 3px;
        }

        @keyframes textReflectionWash {

        }

        .sub-tagline {

            color: #b0b4be;
            margin: 0 auto 45px auto;
            font-weight: 400;
            max-width: 950px;
            display: block;
        }

            display: flex;

            padding-right: 25px;
        }

        .manifesto-text {
            color: #ffffff;
            font-size: 17px;

            line-height: 1.8;
            margin: 0 0 10px 0;
            text-align: justify;
        }
