<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sXEnter Gateway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap');

        body { background-color: #303132; color: #ffffff; font-family: 'Montserrat', sans-serif; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .gateway-container { width: 100%; max-width: 1000px; text-align: center; }
        
        /* Layout */
        .split-cockpit-layout { display: flex; gap: 60px; margin-top: 40px; text-align: left; }
        .column-left { flex: 1; }
        .column-right { flex: 1; }

        /* Styles */
        h1 { font-size: 50px; margin-bottom: 10px; }
        .sub-tagline { color: #b0b4be; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .manifesto-text { font-size: 17px; line-height: 1.8; margin-bottom: 20px; text-align: justify; }
        
        .track-box { background-color: #424344; padding: 30px; border-radius: 14px; }
        .track-item { margin-bottom: 20px; cursor: pointer; display: flex; align-items: flex-start; }
        .track-item input { margin-right: 15px; margin-top: 5px; }
        .track-title { font-weight: 700; display: block; }
        .track-desc { font-size: 14px; color: #e5e7eb; }

        @media (max-width: 800px) {
            .split-cockpit-layout { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="gateway-container">
        <h1>sXEnter™ GATEWAY</h1>
        <div class="sub-tagline">BUSINESS INFRASTRUCTURE | STRIPPED OF HUMAN NOISE</div>
        
        <div class="split-cockpit-layout">
            <!-- LEFT SIDE TEXT -->
            <div class="column-left">
                <p class="manifesto-text">Inside the sXEcoStructure™, technology is no longer allowed to consume your life.</p>
                <p class="manifesto-text">We have built this architecture to grant ordinary people total systemic relief. You transition from a manual worker to a sXSovereignOperator™.</p>
            </div>
            
            <!-- RIGHT SIDE TRACKS -->
            <div class="column-right">
                <div class="track-box">
                    <label class="track-item"><input type="radio" name="track"> <div><span class="track-title">Service Corporate Clients</span><span class="track-desc">Engineered for Doctors and Agencies.</span></div></label>
                    <label class="track-item"><input type="radio" name="track"> <div><span class="track-title">Operate My Own Business</span><span class="track-desc">Engineered for Coaches and MRR.</span></div></label>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
