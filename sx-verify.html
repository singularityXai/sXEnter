<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sXVerify Protocol</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=3" sizes="any">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        /* Core Layout Elements */
        body {
            background-color: #303132;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.5px;
            overflow-x: hidden;
        }

        /* Container Layout - Mirroring Gateway above-the-fold spacing */
        .gateway-container {
            width: 100%;
            max-width: 1200px;
            padding: 20px 40px;
            text-align: center;
            box-sizing: border-box;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        /* Sovereign Highlighting Style */
        .sx-sovereign {
            font-weight: 700;
            display: inline;
        }

        .sx-bold {
            font-weight: 700;
            display: inline;
            color: #ffffff;
        }

        /* Crown Branding Layer */
        .logo-container {
            width: 100%;
            max-width: 420px; 
            margin: 0 auto;
            position: relative;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Balanced Proportional Divider Line */
        .brand-divider {
            width: 420px;
            height: 1px;
            background-color: #636773;
            margin: 15px auto 25px auto;
            border: none;
        }

        /* Massive Authoritative Header */
        h1 {
            font-size: 54px; 
            font-weight: 400;
            margin: 0 auto 10px auto; 
            letter-spacing: 4px;
            display: block;
            width: 100%;
            max-width: 950px;
            background: linear-gradient(90deg, #ffffff 0%, #ffffff 35%, #9da1aa 48%, #ffffff 55%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            animation: textReflectionWash 6s infinite linear;
        }

        @keyframes textReflectionWash {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* Focused Identity Block Layout */
        .identity-focus-heading {
            font-size: 32px;
            font-weight: 600;
            color: #b0b4be;
            margin: 30px auto 15px auto;
            letter-spacing: 0.5px;
        }

        .sub-tagline {
            font-size: 16px;
            letter-spacing: 0.5px;
            color: #b0b4be;
            margin: 0 auto 35px auto; 
            font-weight: 300;
            line-height: 1.6;
            max-width: 700px;
            display: block;
        }

        /* High-Contrast Target Highlight */
        .gmail-highlight {
            font-weight: 600;
            color: #ffffff;
        }

        /* Sleek Control Form Elements - Scaled Down Evenly */
        .control-input-wrapper {
            width: 100%;
            max-width: 280px;
            margin: 0 auto 25px auto;
        }

        .code-input {
            width: 100%;
            background-color: #424344;
            border: 1px solid #ffffff;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            color: #ffffff;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            letter-spacing: 2px;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .code-input::placeholder {
            color: #8c9099;
            font-weight: 300;
        }

        /* Signature Blue Action Button - Proportional downscale (smaller than input container) */
        .verify-auth-btn {
            background-color: #1877f2;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            padding: 16px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 230px;
            margin: 0 auto;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.3);
            box-sizing: border-box;
        }

        .verify-auth-btn:hover {
            background-color: #115cc9;
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.5);
        }

        .error-message {
            color: #ff4a4a;
            font-size: 13px;
            margin-top: 15px;
            display: none;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Mobile Optimization Media Breaks */
        @media (max-width: 900px) {
            body, html {
                overflow-y: auto; 
                height: auto;
            }
            .gateway-container {
                min-height: 100vh;
                padding: 40px 20px;
            }
            h1 {
                font-size: 34px; 
                letter-spacing: 2px;
            }
            .brand-divider {
                width: 200px;
            }
            .identity-focus-heading {
                font-size: 24px;
            }
            .sub-tagline {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="gateway-container">
        
        <div class="logo-container">
            <img src="logo.png" alt="SingularityX" onerror="this.style.display='none';">
        </div>

        <hr class="brand-divider">

        <h1><span class="sx-sovereign">sX</span>Verify <span class="sx-bold">PROTOCOL</span></h1>
        
        <div class="identity-focus-heading">Securing Your Identity...</div>
        <div class="sub-tagline">
            A Secure Verification Code has been sent to your <span class="gmail-highlight">Gmail</span>.<br>
            Enter the 6-digit code below to initialize your session.
        </div>

        <div class="control-input-wrapper">
            <input type="text" class="code-input" id="sessionCodeInput" placeholder="Enter 6-digit Code" maxlength="6">
            <div class="error-message" id="verificationError">Invalid token parameter. Please crosscheck your session code.</div>
        </div>

        <div>
            <button class="verify-auth-btn" id="submitVerifyTrigger">
                <span>VERIFY → OperatorIdentity</span>
            </button>
        </div>

    </div>

    <script>
        document.getElementById('submitVerifyTrigger').addEventListener('click', function(e) {
            e.preventDefault();
            const enteredCode = document.getElementById('sessionCodeInput').value.trim();
            const storedCode = localStorage.getItem('sX_generated_code');
            const errorDisplay = document.getElementById('verificationError');

            if (enteredCode === storedCode && storedCode !== null) {
                errorDisplay.style.display = 'none';
                // Direct route to core engine environment
                window.location.href = "https://creatorapp.zoho.com/singularityx8/sXEngine";
            } else {
                errorDisplay.style.display = 'block';
            }
        });
    </script>
</body>
</html>
